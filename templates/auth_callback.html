<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Autenticando... — Zephr</title>
<style>
  body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;gap:12px}
  .spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,0.1);border-top-color:rgba(255,255,255,0.6);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:14px;color:rgba(255,255,255,0.4);margin:0}
</style>
</head>
<body>
<div class="spinner"></div>
<p>Autenticando con Google...</p>
<script>
  // Este template solo se muestra brevemente mientras Flask procesa /auth/callback.
  // Si el servidor no redirige (por ejemplo, acceso directo sin ?code), redirigir al login.
  var hasCode = window.location.search.includes('code=');
  if (!hasCode) {
    window.location.href = '/login';
  }
</script>
</body>
</html>
