<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pagina no encontrada — Zephr">
    <meta name="theme-color" content="#0a0a0a">
    <title>404 — Zephr</title>
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:#0a0e17;color:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.06) 0%,transparent 60%);pointer-events:none}
        .error-page{position:relative;z-index:1;padding:2rem}
        .error-code{font-size:8rem;font-weight:800;color:rgba(148,163,184,.15);line-height:1;letter-spacing:-.05em}
        .error-title{font-size:1.3rem;font-weight:600;margin-top:.5rem;color:#f0f4f8}
        .error-desc{font-size:.9rem;color:#64748b;margin-top:.5rem;max-width:360px;margin-inline:auto}
        .error-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:2rem;padding:.7rem 1.6rem;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:box-shadow .2s,transform .15s}
        .error-btn:hover{box-shadow:0 4px 20px rgba(59,130,246,.4);transform:translateY(-2px)}
        .error-btn svg{width:16px;height:16px}
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Pagina no encontrada</h1>
        <p class="error-desc">La ruta que buscas no existe. Puede que el enlace este roto o haya sido movido.</p>
        <a href="/" class="error-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Volver al inicio
        </a>
    </div>
</body>
</html>
