<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago exitoso — Zephr</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0d0d0d;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .card{text-align:center;max-width:420px;padding:48px 40px}
        .icon{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
        .icon svg{width:36px;height:36px;color:#22c55e}
        h1{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-bottom:12px}
        p{color:rgba(255,255,255,0.5);font-size:16px;line-height:1.6;margin-bottom:36px}
        .plan-name{color:#8ab0ff;font-weight:600}
        .btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0a0a0a;font-weight:600;padding:14px 28px;border-radius:8px;border:none;font-family:inherit;font-size:15px;cursor:pointer;transition:background 200ms;text-decoration:none}
        .btn:hover{background:rgba(255,255,255,0.9)}
        @keyframes confetti-fall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
        .confetti{position:fixed;top:-10px;width:8px;height:8px;border-radius:2px;animation:confetti-fall linear forwards;pointer-events:none;z-index:-1}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></div>
        <h1>¡Pago exitoso!</h1>
        <p>Tu plan <span class="plan-name">{{ plan_name }}</span> está activo. Disfruta de búsquedas ilimitadas y todas las funciones premium.</p>
        <a href="/app" class="btn">Ir a Zephr →</a>
    </div>
    <script>
    (function(){
        var colors=['#22c55e','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4'];
        for(var i=0;i<40;i++){
            var el=document.createElement('div');
            el.className='confetti';
            el.style.left=Math.random()*100+'vw';
            el.style.background=colors[Math.floor(Math.random()*colors.length)];
            el.style.animationDuration=(2+Math.random()*3)+'s';
            el.style.animationDelay=(Math.random()*2)+'s';
            el.style.width=(6+Math.random()*6)+'px';
            el.style.height=(6+Math.random()*6)+'px';
            document.body.appendChild(el);
        }
    })();
    </script>
</body>
</html>
