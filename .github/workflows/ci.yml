name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read
  # gitleaks-action reads GET /repos/{o}/{r}/pulls/{n}/commits on pull_request
  # events; without this it fails with 403 "Resource not accessible by
  # integration" while push runs stay green.
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (locked) and the package
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Ruff
        run: |
          pip install ruff
          ruff check .

      - name: Import check (every scraper and entry point)
        run: |
          python - <<'EOF'
          import importlib
          mods = [
              "scrapers.easa", "scrapers.federal_register", "scrapers.transport_canada",
              "scrapers.anac_brazil", "scrapers.uk_caa", "scrapers.faa_govinfo",
              "scrapers.anac_argentina", "scrapers.dgac_chile", "scrapers.gcaa_uae",
              "scrapers.casa_australia", "scrapers.aerocivil_colombia",
              "enrich", "utils", "populate_db",
          ]
          for m in mods:
              importlib.import_module(m)
          print(f"{len(mods)} modules import cleanly")
          EOF

      - name: Self-checks (no network, no DB)
        run: |
          python scripts/test_upsert_dedup.py
          python scripts/test_faa_identity.py
          python scripts/test_equivalents_checksum.py

      - name: HTTP contract suite
        run: |
          pip install pytest
          pytest tests/ -q

      # Audits the exact pinned versions the cron installs against prod —
      # ranges can silently pick up a vulnerable release between runs.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
