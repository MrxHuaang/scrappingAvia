name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read
  # gitleaks-action reads GET /repos/{o}/{r}/pulls/{n}/commits on pull_request
  # events; without this it fails with 403 "Resource not accessible by
  # integration" while push runs stay green.
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (locked) and the package
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Ruff
        run: |
          pip install ruff
          ruff check .

      # A workflow file with an invalid expression is not a workflow that fails
      # loudly: GitHub aborts the run before creating any job, so every check
      # reports `failure` in 0s with an empty job list and nothing says why. That
      # went unnoticed for twelve runs in the sibling repo. actionlint validates
      # expressions and context availability, which is exactly what was missing.
      # Pinned by digest (v1.7.12) so the gate cannot change under us.
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Import check (every scraper and entry point)
        run: |
          python - <<'EOF'
          import importlib
          mods = [
              "scrapers.easa", "scrapers.federal_register", "scrapers.transport_canada",
              "scrapers.anac_brazil", "scrapers.uk_caa", "scrapers.faa_govinfo",
              "scrapers.anac_argentina", "scrapers.dgac_chile", "scrapers.gcaa_uae",
              "scrapers.casa_australia", "scrapers.aerocivil_colombia",
              "enrich", "utils", "populate_db",
          ]
          for m in mods:
              importlib.import_module(m)
          print(f"{len(mods)} modules import cleanly")
          EOF

      - name: Self-checks (no network, no DB)
        run: |
          python scripts/test_upsert_dedup.py
          python scripts/test_faa_identity.py
          python scripts/test_equivalents_checksum.py

      - name: HTTP contract suite and workflow-drift guard
        run: |
          pip install pytest pyyaml
          pytest tests/ -q

      # Audits the exact pinned versions the cron installs against prod —
      # ranges can silently pick up a vulnerable release between runs.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
